<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avia Masters - Master Edition</title>
  <style>
    :root {
      --bg-sky-top: #102a71;
      --bg-sky-mid: #1d4ed8;
      --ocean-blue: #0b193d;
      --gold-yellow: #ffcc00;
      --gold-hover: #ffd633;
      --accent-green: #00e676;
      --accent-red: #ff3344;
      --card-bg: #0f172a;
      --text-gray: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow-x: hidden; }
    
    .game-wrapper {
      width: 100%; height: 100vh; max-height: 100vh; background: #020617;
      display: flex; flex-direction: column; position: relative; margin: 0 auto; overflow: hidden;
    }

    /* 1. Direct In-Game Brand Header (No duplicate phone nav bars) */
    .brand-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #0b1120; font-size: 11px; font-weight: bold; color: var(--text-gray); z-index: 10; flex-shrink: 0; border-bottom: 1px solid #1e293b;
    }
    .bgaming-tag { display: flex; align-items: center; gap: 6px; }
    .bgaming-badge { background: #ffcc00; color: #000; font-weight: 900; padding: 2px 5px; border-radius: 3px; font-size: 10px; }
    
    .header-right-meta { display: flex; align-items: center; gap: 10px; }
    .bal-pill {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 3px 8px; font-size: 11px; font-weight: 900; color: var(--accent-green);
    }
    .header-controls { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #fff; cursor: pointer; }

    /* 2. Main Flight Canvas Area */
    .flight-arena {
      flex: 1; min-height: 0; position: relative; overflow: hidden;
      background: linear-gradient(180deg, #102357 0%, #1e40af 60%, #172554 100%);
    }
    #flightCanvas { width: 100%; height: 100%; display: block; }

    /* Watermark Logo */
    .watermark-logo {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      font-size: 26px; font-weight: 900; color: rgba(255, 255, 255, 0.08); letter-spacing: 2px;
      text-transform: uppercase; pointer-events: none; text-align: center; line-height: 1;
    }
    .watermark-logo span { display: block; font-size: 15px; letter-spacing: 6px; }

    /* 3. Speed Selector Row (🐢, 🚶, 🐇, ⚡) */
    .speed-selector-row {
      position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); padding: 4px 8px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .speed-btn {
      width: 36px; height: 36px; border-radius: 50%; background: #1e293b; border: 1px solid #334155;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s;
    }
    .speed-btn svg { width: 17px; height: 17px; fill: #cbd5e1; }
    .speed-btn.active {
      background: #3b82f6; border-color: #60a5fa; box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    }
    .speed-btn.active svg { fill: #fff; }

    /* 4. Flight Stats Dashboard */
    .flight-stats-pill {
      position: absolute; bottom: 15px; left: 12px; right: 12px; background: rgba(11, 25, 61, 0.85);
      backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
      display: flex; justify-content: space-around; padding: 5px 8px; z-index: 5;
    }
    .stat-col { text-align: center; }
    .stat-label { font-size: 8px; font-weight: 800; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-val { font-size: 13px; font-weight: 900; color: #fff; margin-top: 1px; }

    /* 5. Bottom Launch Controls */
    .bottom-controls-area {
      background: #090e1a; border-top: 1px solid #1e293b; padding: 10px 16px 14px;
      display: flex; flex-direction: column; align-items: center; z-index: 10; flex-shrink: 0;
    }

    .play-button-wrapper { position: relative; margin-bottom: 8px; }
    .big-launch-btn {
      width: 82px; height: 82px; border-radius: 50%; background: #0f172a; border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s transform, 0.15s opacity;
    }
    .big-launch-btn:active { transform: scale(0.92); }
    .play-arrow-svg { margin-left: 4px; width: 26px; height: 26px; fill: #fff; }

    .auto-btn-badge {
      position: absolute; right: -24px; top: 12px; width: 26px; height: 26px; border-radius: 50%;
      background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #fff; cursor: pointer;
    }
    .auto-btn-badge.active { background: #3b82f6; border-color: #60a5fa; }

    .bottom-bet-row {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
    }
    .bal-block { display: flex; flex-direction: column; }
    .bal-title { font-size: 9px; font-weight: 800; color: var(--text-gray); }
    .bal-num { font-size: 14px; font-weight: 900; color: #fff; }

    .bet-block { display: flex; flex-direction: column; align-items: flex-end; }
    .bet-title { font-size: 9px; font-weight: 800; color: var(--text-gray); }
    .bet-selector-stepper { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
    .bet-stepper-btn { background: none; border: none; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
    .bet-num-val { font-size: 15px; font-weight: 900; color: #fff; }

    /* 6. Settings Modal (Screenshot 2 Accuracy) */
    .settings-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(5, 10, 20, 0.95); z-index: 100;
      flex-direction: column; padding: 15px; overflow-y: auto;
    }
    .modal-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-close-icon { font-size: 22px; cursor: pointer; color: #fff; }
    
    .settings-title { font-size: 18px; font-weight: 900; letter-spacing: 4px; text-align: center; margin-bottom: 25px; color: #fff; }
    .slider-group { margin-bottom: 20px; }
    .slider-label { font-size: 12px; font-weight: 800; color: var(--text-gray); margin-bottom: 8px; text-transform: uppercase; }
    .custom-slider {
      width: 100%; height: 6px; background: #1e293b; border-radius: 3px; outline: none; -webkit-appearance: none;
    }
    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #3b82f6; border: 2px solid #fff; cursor: pointer;
    }

    .btn-reset-spin {
      width: 100%; background: #1e293b; border: 1px solid #334155; color: #fff; font-weight: 800;
      font-size: 13px; padding: 10px; border-radius: 20px; cursor: pointer; margin: 15px 0 25px; text-transform: uppercase;
    }

    .wheel-container {
      display: flex; flex-direction: column; align-items: center; margin-top: 10px;
    }
    .position-wheel {
      width: 110px; height: 110px; border-radius: 50%; border: 3px solid #fff; position: relative;
      display: flex; align-items: center; justify-content: center; margin: 10px 0;
    }
    .wheel-text { font-size: 10px; font-weight: bold; text-align: center; color: #fff; }

    /* Clean Floating Win Banner */
    .clean-win-banner {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #00c853, #00e676); color: #000; font-size: 14px; font-weight: 900;
      padding: 8px 20px; border-radius: 30px; box-shadow: 0 6px 25px rgba(0, 230, 118, 0.6);
      z-index: 9999; display: none; animation: popWin 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popWin { 0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
  </style>
</head>
<body>

<div class="game-wrapper">
  <!-- Clean Win Banner -->
  <div class="clean-win-banner" id="cleanWinBanner">
    🎉 <span id="winBannerText">+250.00 ETB Won (Safe Landing)!</span>
  </div>

  <!-- 1. In-Game Brand Header (Direct Header) -->
  <div class="brand-header">
    <div class="bgaming-tag">
      <span class="bgaming-badge">B</span>
      <span>AVIAMASTERS</span>
      <span id="liveClock">22:50</span>
    </div>

    <div class="header-right-meta">
      <div class="bal-pill"><span id="userBalText">0.00</span> ETB</div>
      <div class="header-controls">
        <!-- Master Sound Toggle (Default: Silent 🔇) -->
        <span id="soundToggleIcon" onclick="toggleGlobalAudio()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>
        </span>
        <span onclick="openSettingsModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </span>
      </div>
    </div>
  </div>

  <!-- 2. Main Flight Scene Canvas Area -->
  <div class="flight-arena">
    <canvas id="flightCanvas"></canvas>
    
    <!-- Watermark Logo -->
    <div class="watermark-logo">
      AVIA
      <span>MASTERS</span>
    </div>

    <!-- 3. Speed Controls Row (🐢, 🚶, 🐇, ⚡) -->
    <div class="speed-selector-row">
      <button class="speed-btn" id="spd-slow" onclick="setFlightSpeed(0.5, 'spd-slow')">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 2.85 1.2 5.41 3.12 7.22l-1.34 2.33 1.74 1 1.54-2.67C8.42 20.57 10.13 21 12 21c1.87 0 3.58-.43 4.94-1.12l1.54 2.67 1.74-1-1.34-2.33C20.8 17.41 22 14.85 22 12c0-5.52-4.48-10-10-10zm0 17c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
      </button>
      <button class="speed-btn active" id="spd-normal" onclick="setFlightSpeed(1.0, 'spd-normal')">
        <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/></svg>
      </button>
      <button class="speed-btn" id="spd-fast" onclick="setFlightSpeed(2.0, 'spd-fast')">
        <svg viewBox="0 0 24 24"><path d="M19 10c0-1.66-1.34-3-3-3s-3 1.34-3 3c0 .8.31 1.52.82 2.06L9 16.88V19h2.12l4.82-4.82c.54.51 1.26.82 2.06.82 1.66 0 3-1.34 3-3zM5 13H3v-2h2v2zm0-4H3V7h2v2zm0-4H3V3h2v2zm4 16H7v-2h2v2z"/></svg>
      </button>
      <button class="speed-btn" id="spd-turbo" onclick="setFlightSpeed(4.0, 'spd-turbo')">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </button>
    </div>

    <!-- 4. Flight Stats Dashboard -->
    <div class="flight-stats-pill">
      <div class="stat-col">
        <div class="stat-label">ALTITUDE</div>
        <div class="stat-val" id="statAltitude">0.0m</div>
      </div>
      <div class="stat-col">
        <div class="stat-label">DISTANCE</div>
        <div class="stat-val" id="statDistance">0.0m</div>
      </div>
      <div class="stat-col">
        <div class="stat-label">MULTIPLIER</div>
        <div class="stat-val" id="statMultiplier" style="color:var(--gold-yellow);">×1.0</div>
      </div>
    </div>
  </div>

  <!-- 5. Bottom Controls Area -->
  <div class="bottom-controls-area">
    <!-- Big Play Launch Button -->
    <div class="play-button-wrapper" id="spinButtonContainer">
      <button class="big-launch-btn" id="launchBtn" onclick="launchAircraft()">
        <svg class="play-arrow-svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <div class="auto-btn-badge" id="autoBadge" onclick="toggleAutoFlight()">A</div>
    </div>

    <!-- Balance & Total Bet Selector -->
    <div class="bottom-bet-row">
      <div class="bal-block">
        <div class="bal-title">BALANCE</div>
        <div class="bal-num"><span id="userBalSpan">0.00</span> ETB</div>
      </div>
      <div class="bet-block">
        <div class="bet-title">TOTAL BET</div>
        <div class="bet-selector-stepper">
          <button class="bet-stepper-btn" onclick="stepBetAmount(5)">▲</button>
          <span class="bet-num-val"><span id="betDisplayVal">20.00</span> ETB</span>
          <button class="bet-stepper-btn" onclick="stepBetAmount(-5)">▼</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 6. Settings Modal (Screenshot 2 Accuracy) -->
<div class="settings-modal-overlay" id="settingsModal">
  <div class="modal-top-bar">
    <div class="bgaming-tag">
      <span class="bgaming-badge">B</span>
      <span>AVIAMASTERS</span>
    </div>
    <div style="display:flex; align-items:center; gap:15px;">
      <span onclick="toggleGlobalAudio()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </span>
      <span class="modal-close-icon" onclick="closeSettingsModal()">✕</span>
    </div>
  </div>

  <div class="settings-title">SETTINGS</div>

  <div class="slider-group">
    <div class="slider-label">SOUND FX</div>
    <input type="range" min="0" max="100" value="80" class="custom-slider" id="soundSlider" oninput="updateAudioGain()">
  </div>

  <div class="slider-group">
    <div class="slider-label">MUSIC</div>
    <input type="range" min="0" max="100" value="60" class="custom-slider">
  </div>

  <button class="btn-reset-spin" onclick="resetSpinButtonSettings()">RESET SPIN BUTTON</button>

  <div class="slider-group">
    <div class="slider-label">SPIN BUTTON'S SIZE</div>
    <input type="range" min="60" max="110" value="82" class="custom-slider" id="btnSizeSlider" oninput="adjustBtnSize(this.value)">
  </div>

  <div class="slider-group">
    <div class="slider-label">SPIN BUTTON'S OPACITY</div>
    <input type="range" min="30" max="100" value="100" class="custom-slider" id="btnOpacitySlider" oninput="adjustBtnOpacity(this.value)">
  </div>

  <div class="wheel-container">
    <div class="position-wheel">
      <div class="wheel-text">Spin button's<br>place 👆</div>
    </div>
  </div>
</div>

<script>
  // Master API URL
  const API_URL = "https://script.google.com/macros/s/AKfycbzCI7hG2Xaz7gEEfHmakGmk4Z2kiQ1hcIho6snlemPGMcIz10pMcEBPE5aP9sNNfYLf/exec";

  function triggerCleanWin(msg) {
    const banner = document.getElementById("cleanWinBanner");
    document.getElementById("winBannerText").innerText = msg;
    banner.style.display = "block";
    setTimeout(() => { banner.style.display = "none"; }, 3500);
  }

  // Master Audio Control (DEFAULT: SILENT 🔇)
  let isMuted = true;
  let audioCtx = null;
  let masterGain = 0.8;

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTone(freq, type, dur) {
    if (isMuted) return;
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(masterGain * 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  const SOUNDS = {
    launch: () => playTone(300, 'sawtooth', 0.4),
    pickup: () => { playTone(600, 'sine', 0.08); setTimeout(() => playTone(900, 'triangle', 0.12), 60); },
    rocketHit: () => playTone(120, 'sawtooth', 0.3),
    landWin: () => { playTone(523.25, 'triangle', 0.15); setTimeout(() => playTone(659.25, 'triangle', 0.15), 100); setTimeout(() => playTone(783.99, 'triangle', 0.3), 200); },
    waterSplash: () => playTone(100, 'sine', 0.3)
  };

  function toggleGlobalAudio() {
    isMuted = !isMuted;
    const el = document.getElementById("soundToggleIcon");
    if (isMuted) {
      el.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg>`;
    } else {
      el.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    }
  }

  function updateAudioGain() {
    masterGain = document.getElementById("soundSlider").value / 100;
  }

  // Digital Clock
  setInterval(() => {
    const d = new Date();
    document.getElementById("liveClock").innerText = d.toTimeString().split(' ')[0].substring(0, 5);
  }, 1000);

  // Real Balance & Server State
  let balance = parseFloat(localStorage.getItem("global_balance") || "0.00");
  let currentBet = 20.00;
  let isFlying = false;
  let gameSpeed = 1.0;
  let autoFlight = false;

  let altitude = 0.0;
  let distance = 0.0;
  let accumulatedMultiplier = 1.0;

  function updateBalanceDisplay() {
    document.getElementById("userBalText").innerText = balance.toFixed(2);
    document.getElementById("userBalSpan").innerText = balance.toFixed(2);
    localStorage.setItem("global_balance", balance.toFixed(2));
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "BALANCE_UPDATE", newBalance: balance }, "*");
      }
    } catch(e) {}
  }
  updateBalanceDisplay();

  async function fetchServerUserBalance() {
    try {
      const res = await fetch(`${API_URL}?action=initUser&userId=589218392`).then(r => r.json());
      if (res && res.balance !== undefined) {
        balance = parseFloat(res.balance);
        updateBalanceDisplay();
      }
    } catch(e) {}
  }
  fetchServerUserBalance();

  // Smart Balanced Flight Outcome Generator (85% Model)
  function calculateFlightOutcome() {
    const roll = Math.random() * 100;
    if (roll <= 65.0) {
      return { success: false, targetMult: 0 };
    } else if (roll <= 92.0) {
      return { success: true, targetMult: Number((1.2 + Math.random() * 2.3).toFixed(2)) };
    } else {
      return { success: true, targetMult: Number((4.0 + Math.random() * 21.0).toFixed(2)) };
    }
  }

  // Canvas Flight Engine
  const canvas = document.getElementById("flightCanvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  let skyTokens = [];

  function initSkyScene() {
    skyTokens = [];
    for (let i = 1; i <= 6; i++) {
      skyTokens.push({
        x: canvas.width * 0.25 * i,
        y: canvas.height * 0.3 + (Math.sin(i) * 40),
        type: i % 3 === 0 ? "ROCKET" : "MULT",
        val: i % 2 === 0 ? 2 : 1.5,
        collected: false
      });
    }
  }

  function drawAviaScene(planeX, planeY, flightProgress) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width;
    const h = canvas.height;

    // Ocean Waves
    ctx.fillStyle = "#0c1b40";
    ctx.fillRect(0, h - 55, w, 55);
    ctx.fillStyle = "#1e3a8a";
    ctx.fillRect(0, h - 58, w, 3);

    // 3D Puffy Voxel Clouds
    drawPuffyClouds(w, h);

    // Aircraft Carrier K07 at Takeoff
    drawAircraftCarrier(w * 0.15 - (flightProgress * w * 0.8), h - 60);

    // Destination Carrier on Success
    if (flightProgress > 0.6) {
      drawAircraftCarrier(w * 0.6 + ((1 - flightProgress) * 100), h - 60);
    }

    // Sky Tokens
    drawSkyTokens(flightProgress);

    // Propeller Biplane
    drawBiplane(planeX, planeY);
  }

  function drawPuffyClouds(w, h) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    ctx.beginPath();
    ctx.arc(w * 0.2, h * 0.45, 30, 0, Math.PI * 2);
    ctx.arc(w * 0.28, h * 0.40, 42, 0, Math.PI * 2);
    ctx.arc(w * 0.38, h * 0.46, 32, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(w * 0.7, h * 0.42, 35, 0, Math.PI * 2);
    ctx.arc(w * 0.8, h * 0.38, 48, 0, Math.PI * 2);
    ctx.arc(w * 0.9, h * 0.44, 30, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawAircraftCarrier(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(160, 0); ctx.lineTo(140, 18); ctx.lineTo(15, 18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ef4444";
    ctx.fillRect(18, 16, 120, 3);

    ctx.fillStyle = "#334155";
    ctx.fillRect(0, -3, 165, 4);

    ctx.fillStyle = "#475569";
    ctx.fillRect(100, -18, 25, 15);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px sans-serif";
    ctx.fillText("K07", 128, 12);

    ctx.restore();
  }

  function drawBiplane(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = "#ffcc00";
    ctx.font = "900 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`${(currentBet * accumulatedMultiplier).toFixed(2)} ETB`, 0, -22);

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(-12, -14, 24, 4);
    ctx.fillRect(-8, 6, 20, 3);

    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.arc(2, -6, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.moveTo(-16, 0); ctx.lineTo(-24, -10); ctx.lineTo(-20, 0);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(18, -10); ctx.lineTo(18, 10);
    ctx.stroke();

    ctx.restore();
  }

  function drawSkyTokens(progress) {
    skyTokens.forEach(token => {
      if (!token.collected) {
        ctx.save();
        ctx.translate(token.x - (progress * canvas.width * 0.6), token.y);

        if (token.type === "MULT") {
          ctx.fillStyle = "#3b82f6";
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = "bold 10px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(`x${token.val}`, 0, 0);
        } else {
          ctx.fillStyle = "#ef4444";
          ctx.font = "14px sans-serif";
          ctx.fillText("🚀", -7, 5);
        }
        ctx.restore();
      }
    });
  }

  function launchAircraft() {
    if (isFlying) return;
    if (currentBet > balance) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "OPEN_DEPOSIT" }, "*");
      }
      return;
    }

    balance -= currentBet;
    updateBalanceDisplay();
    SOUNDS.launch();

    isFlying = true;
    altitude = 0.0;
    distance = 0.0;
    accumulatedMultiplier = 1.0;
    initSkyScene();

    const outcome = calculateFlightOutcome();
    let progress = 0;

    const flightInterval = setInterval(() => {
      progress += (0.015 * gameSpeed);
      distance += (1.2 * gameSpeed);

      skyTokens.forEach(t => {
        if (!t.collected && Math.abs((progress * canvas.width * 0.8) - t.x) < 25) {
          t.collected = true;
          if (t.type === "MULT") {
            accumulatedMultiplier = Number((accumulatedMultiplier * t.val).toFixed(2));
            altitude += 15.0;
            SOUNDS.pickup();
          } else {
            accumulatedMultiplier = Math.max(1.0, Number((accumulatedMultiplier * 0.5).toFixed(2)));
            altitude = Math.max(5.0, altitude - 20.0);
            SOUNDS.rocketHit();
          }
        }
      });

      document.getElementById("statAltitude").innerText = altitude.toFixed(1) + "m";
      document.getElementById("statDistance").innerText = distance.toFixed(1) + "m";
      document.getElementById("statMultiplier").innerText = "×" + accumulatedMultiplier.toFixed(1);

      const planeX = canvas.width * 0.35;
      const planeY = (canvas.height - 70) - (Math.sin(progress * Math.PI) * 120);

      drawAviaScene(planeX, planeY, progress);

      if (progress >= 1.0) {
        clearInterval(flightInterval);
        isFlying = false;

        if (outcome.success) {
          accumulatedMultiplier = outcome.targetMult;
          const winAmt = Number((currentBet * accumulatedMultiplier).toFixed(2));
          balance += winAmt;
          updateBalanceDisplay();
          SOUNDS.landWin();
          triggerCleanWin(`🎉 +${winAmt.toFixed(2)} ETB Won (Safe Landing)!`);
        } else {
          SOUNDS.waterSplash();
          triggerCleanWin("🌊 Splashdown in ocean! Flight ended.");
        }

        setTimeout(() => {
          altitude = 0.0;
          distance = 0.0;
          accumulatedMultiplier = 1.0;
          document.getElementById("statAltitude").innerText = "0.0m";
          document.getElementById("statDistance").innerText = "0.0m";
          document.getElementById("statMultiplier").innerText = "×1.0";
          drawAviaScene(canvas.width * 0.25, canvas.height - 68, 0);

          if (autoFlight) launchAircraft();
        }, 1500);
      }
    }, 50);
  }

  function setFlightSpeed(spd, btnId) {
    gameSpeed = spd;
    document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(btnId).classList.add("active");
  }

  function stepBetAmount(val) {
    if (isFlying) return;
    const next = Math.max(5, currentBet + val);
    currentBet = Math.min(balance > 0 ? balance : 1000, next);
    document.getElementById("betDisplayVal").innerText = currentBet.toFixed(2);
  }

  function toggleAutoFlight() {
    autoFlight = !autoFlight;
    document.getElementById("autoBadge").classList.toggle("active", autoFlight);
    if (autoFlight && !isFlying) launchAircraft();
  }

  function openSettingsModal() { document.getElementById("settingsModal").style.display = "flex"; }
  function closeSettingsModal() { document.getElementById("settingsModal").style.display = "none"; }

  function adjustBtnSize(val) {
    const btn = document.getElementById("launchBtn");
    btn.style.width = val + "px";
    btn.style.height = val + "px";
  }

  function adjustBtnOpacity(val) {
    document.getElementById("launchBtn").style.opacity = val / 100;
  }

  function resetSpinButtonSettings() {
    adjustBtnSize(82);
    adjustBtnOpacity(100);
    document.getElementById("btnSizeSlider").value = 82;
    document.getElementById("btnOpacitySlider").value = 100;
  }

  // Initial Scene Draw
  drawAviaScene(canvas.width * 0.25, canvas.height - 68, 0);
</script>
</body>
</html>
