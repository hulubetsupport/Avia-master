<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avia Masters - BGaming Official Edition</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-sky-top: #102a71;
      --bg-sky-mid: #1d4ed8;
      --ocean-blue: #0b193d;
      --gold-yellow: #ffcc00;
      --accent-green: #00e676;
      --accent-red: #ff3344;
      --card-bg: #0f172a;
      --text-gray: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
    
    .game-wrapper {
      width: 100%; height: 100vh; background: #020617;
      display: flex; flex-direction: column; position: relative; margin: 0 auto; max-width: 480px;
    }

    /* 1. Header */
    .brand-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #0b1120; font-size: 11px; font-weight: bold; color: var(--text-gray); z-index: 10; flex-shrink: 0; border-bottom: 1px solid #1e293b;
    }
    .bgaming-tag { display: flex; align-items: center; gap: 6px; }
    .bgaming-badge { background: #ffcc00; color: #000; font-weight: 900; padding: 2px 5px; border-radius: 3px; font-size: 10px; }
    
    .header-right-meta { display: flex; align-items: center; gap: 10px; }
    .bal-pill {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 3px 8px; font-size: 11px; font-weight: 900; color: var(--accent-green);
    }
    .header-controls { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #fff; cursor: pointer; }

    /* 2. Main Flight Canvas Area */
    .flight-arena {
      flex: 1; min-height: 0; position: relative; overflow: hidden;
      background: linear-gradient(180deg, #102357 0%, #1e40af 60%, #172554 100%);
    }
    #flightCanvas { width: 100%; height: 100%; display: block; }

    .watermark-logo {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      font-size: 24px; font-weight: 900; color: rgba(255, 255, 255, 0.08); letter-spacing: 2px;
      text-transform: uppercase; pointer-events: none; text-align: center; line-height: 1;
    }
    .watermark-logo span { display: block; font-size: 14px; letter-spacing: 5px; }

    /* 3. Speed Selector Row */
    .speed-selector-row {
      position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); padding: 4px 8px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .speed-btn {
      width: 34px; height: 34px; border-radius: 50%; background: #1e293b; border: 1px solid #334155;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; font-size: 14px;
    }
    .speed-btn.active {
      background: #3b82f6; border-color: #60a5fa; box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
    }

    /* 4. Flight Stats Dashboard */
    .flight-stats-pill {
      position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(11, 25, 61, 0.85);
      backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
      display: flex; justify-content: space-around; padding: 5px 8px; z-index: 5;
    }
    .stat-col { text-align: center; }
    .stat-label { font-size: 8px; font-weight: 800; color: var(--text-gray); text-transform: uppercase; }
    .stat-val { font-size: 13px; font-weight: 900; color: #fff; margin-top: 1px; }

    /* 5. Bottom Launch Controls */
    .bottom-controls-area {
      background: #090e1a; border-top: 1px solid #1e293b; padding: 8px 16px 14px;
      display: flex; flex-direction: column; align-items: center; z-index: 10; flex-shrink: 0;
    }

    .play-button-wrapper { position: relative; margin-bottom: 6px; }
    .big-launch-btn {
      width: 78px; height: 78px; border-radius: 50%; background: #0f172a; border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3), inset 0 0 10px rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s transform;
    }
    .big-launch-btn:active { transform: scale(0.92); }
    .play-arrow-svg { margin-left: 4px; width: 24px; height: 24px; fill: #fff; }

    .auto-btn-badge {
      position: absolute; right: -22px; top: 10px; width: 26px; height: 26px; border-radius: 50%;
      background: #1e293b; border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 900; color: #fff; cursor: pointer;
    }
    .auto-btn-badge.active { background: #3b82f6; border-color: #60a5fa; }

    .bottom-bet-row {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
    }
    .bal-block { display: flex; flex-direction: column; }
    .bal-title { font-size: 9px; font-weight: 800; color: var(--text-gray); }
    .bal-num { font-size: 13px; font-weight: 900; color: #fff; }

    .bet-block { display: flex; flex-direction: column; align-items: flex-end; }
    .bet-title { font-size: 9px; font-weight: 800; color: var(--text-gray); }
    .bet-selector-stepper { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
    .bet-stepper-btn { background: #1e293b; border: 1px solid #334155; color: #fff; font-size: 12px; font-weight: bold; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .bet-num-val { font-size: 14px; font-weight: 900; color: #fff; }

    /* Clean Floating Win Banner */
    .clean-win-banner {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #00c853, #00e676); color: #000; font-size: 13px; font-weight: 900;
      padding: 8px 20px; border-radius: 30px; box-shadow: 0 6px 25px rgba(0, 230, 118, 0.6);
      z-index: 9999; display: none; animation: popWin 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popWin { 0% { transform: translate(-50%, -20px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
  </style>
</head>
<body>

<div class="game-wrapper">
  <!-- Clean Win Banner -->
  <div class="clean-win-banner" id="cleanWinBanner">
    🎉 <span id="winBannerText">+0.00 ETB Won (Safe Landing)!</span>
  </div>

  <!-- 1. Header -->
  <div class="brand-header">
    <div class="bgaming-tag">
      <span class="bgaming-badge">B</span>
      <span>AVIAMASTERS</span>
    </div>
    <div class="header-right-meta">
      <div class="bal-pill"><span id="userBalText">0.00</span> ETB</div>
    </div>
  </div>

  <!-- 2. Flight Arena Canvas -->
  <div class="flight-arena">
    <canvas id="flightCanvas"></canvas>
    
    <div class="watermark-logo">
      AVIA
      <span>MASTERS</span>
    </div>

    <!-- 3. Speed Selector (🐢, 🚶, 🐇, ⚡) -->
    <div class="speed-selector-row">
      <button class="speed-btn" id="spd-slow" onclick="setFlightSpeed(0.5, 'spd-slow')">🐢</button>
      <button class="speed-btn active" id="spd-normal" onclick="setFlightSpeed(1.0, 'spd-normal')">🚶</button>
      <button class="speed-btn" id="spd-fast" onclick="setFlightSpeed(2.0, 'spd-fast')">🐇</button>
      <button class="speed-btn" id="spd-turbo" onclick="setFlightSpeed(3.5, 'spd-turbo')">⚡</button>
    </div>

    <!-- 4. Flight Stats Dashboard -->
    <div class="flight-stats-pill">
      <div class="stat-col">
        <div class="stat-label">ALTITUDE</div>
        <div class="stat-val" id="statAltitude">0.0m</div>
      </div>
      <div class="stat-col">
        <div class="stat-label">DISTANCE</div>
        <div class="stat-val" id="statDistance">0.0m</div>
      </div>
      <div class="stat-col">
        <div class="stat-label">MULTIPLIER</div>
        <div class="stat-val" id="statMultiplier" style="color:var(--gold-yellow);">×1.0</div>
      </div>
    </div>
  </div>

  <!-- 5. Bottom Launch Controls -->
  <div class="bottom-controls-area">
    <div class="play-button-wrapper">
      <button class="big-launch-btn" id="launchBtn" onclick="launchAircraft()">
        <svg class="play-arrow-svg" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <div class="auto-btn-badge" id="autoBadge" onclick="toggleAutoFlight()">A</div>
    </div>

    <div class="bottom-bet-row">
      <div class="bal-block">
        <div class="bal-title">BALANCE</div>
        <div class="bal-num"><span id="userBalSpan">0.00</span> ETB</div>
      </div>
      <div class="bet-block">
        <div class="bet-title">TOTAL BET</div>
        <div class="bet-selector-stepper">
          <button class="bet-stepper-btn" onclick="stepBetAmount(-5)">−</button>
          <span class="bet-num-val"><span id="betDisplayVal">20.00</span> ETB</span>
          <button class="bet-stepper-btn" onclick="stepBetAmount(5)">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================================================
  // 🚀 AVIAMASTERS - INTEGRATED WITH HULU BET RENDER BACKEND (/api/bet/play)
  // ============================================================================
  const RENDER_BASE_URL = "https://hulubet-server.onrender.com";

  // URL Injection: User ID & Balance from Main Lobby
  const urlParams = new URLSearchParams(window.location.search);
  let USER_ID = urlParams.get('userId') || "589218392";
  let balance = parseFloat(urlParams.get('balance')) || 20.00;

  function triggerCleanWin(msg) {
    const banner = document.getElementById("cleanWinBanner");
    document.getElementById("winBannerText").innerText = msg;
    banner.style.display = "block";
    setTimeout(() => { banner.style.display = "none"; }, 3500);
  }

  // Audio Synthesizer
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  function playTone(freq, type, dur) {
    try {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  const SOUNDS = {
    launch: () => playTone(300, 'sawtooth', 0.4),
    pickup: () => { playTone(600, 'sine', 0.08); setTimeout(() => playTone(900, 'triangle', 0.12), 60); },
    landWin: () => { playTone(523, 'triangle', 0.12); setTimeout(() => playTone(659, 'triangle', 0.12), 90); setTimeout(() => playTone(783, 'triangle', 0.25), 180); },
    splash: () => playTone(120, 'sine', 0.3)
  };

  // State Management
  let currentBet = 20.00;
  let isFlying = false;
  let gameSpeed = 1.0;
  let autoFlight = false;

  let altitude = 0.0;
  let distance = 0.0;
  let accumulatedMultiplier = 1.0;
  let skyTokens = [];

  function updateBalanceDisplay() {
    document.getElementById("userBalText").innerText = balance.toFixed(2);
    document.getElementById("userBalSpan").innerText = balance.toFixed(2);
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "BALANCE_UPDATE", newBalance: balance }, "*");
      }
    } catch(e) {}
  }
  updateBalanceDisplay();

  // Handshake with Lobby
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "GAME_READY" }, "*");
  }
  window.addEventListener('message', (e) => {
    if (e.data?.type === 'INIT_BALANCE' || e.data?.type === 'UPDATE_BALANCE') {
      if (e.data.balance !== undefined) { balance = parseFloat(e.data.balance); updateBalanceDisplay(); }
      if (e.data.userId) USER_ID = String(e.data.userId);
    }
  });

  // Canvas Flight Scene
  const canvas = document.getElementById("flightCanvas");
  const ctx = canvas.getContext("2d");
  function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function initSkyScene() {
    skyTokens = [];
    for (let i = 1; i <= 6; i++) {
      skyTokens.push({
        x: canvas.width * 0.25 * i,
        y: canvas.height * 0.3 + (Math.sin(i) * 35),
        type: i % 3 === 0 ? "ROCKET" : "MULT",
        val: i % 2 === 0 ? 2 : 1.5,
        collected: false
      });
    }
  }

  function drawAviaScene(planeX, planeY, flightProgress, showDestination) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height;

    // Ocean Waves
    ctx.fillStyle = "#0c1b40"; ctx.fillRect(0, h - 55, w, 55);
    ctx.fillStyle = "#1e3a8a"; ctx.fillRect(0, h - 58, w, 3);

    // Clouds
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    ctx.beginPath(); ctx.arc(w * 0.2, h * 0.45, 28, 0, Math.PI * 2); ctx.arc(w * 0.3, h * 0.4, 38, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.75, h * 0.4, 32, 0, Math.PI * 2); ctx.arc(w * 0.85, h * 0.36, 42, 0, Math.PI * 2); ctx.fill();

    // Takeoff Aircraft Carrier K07
    drawCarrier(w * 0.15 - (flightProgress * w * 0.8), h - 60);

    // Destination Carrier K07 on Safe Landing
    if (showDestination) {
      drawCarrier(w * 0.65 + ((1 - flightProgress) * 90), h - 60);
    }

    // Sky Tokens
    drawSkyTokens(flightProgress);

    // Propeller Biplane
    drawBiplane(planeX, planeY);
  }

  function drawCarrier(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#64748b";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, 0); ctx.lineTo(135, 16); ctx.lineTo(12, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ef4444"; ctx.fillRect(16, 14, 115, 3);
    ctx.fillStyle = "#334155"; ctx.fillRect(0, -3, 155, 3);
    ctx.fillStyle = "#fff"; ctx.font = "bold 8px sans-serif"; ctx.fillText("K07", 120, 11);
    ctx.restore();
  }

  function drawBiplane(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Live Payout Tag
    ctx.fillStyle = "#ffcc00"; ctx.font = "900 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(`${(currentBet * accumulatedMultiplier).toFixed(2)} ETB`, 0, -20);

    // Fuselage
    ctx.fillStyle = "#ef4444";
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 7, 0, 0, Math.PI * 2); ctx.fill();
    // Yellow Wings
    ctx.fillStyle = "#ffcc00"; ctx.fillRect(-10, -12, 22, 3); ctx.fillRect(-7, 6, 18, 3);
    // Propeller
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(16, -9); ctx.lineTo(16, 9); ctx.stroke();
    ctx.restore();
  }

  function drawSkyTokens(progress) {
    skyTokens.forEach(token => {
      if (!token.collected) {
        ctx.save();
        ctx.translate(token.x - (progress * canvas.width * 0.6), token.y);
        if (token.type === "MULT") {
          ctx.fillStyle = "#3b82f6"; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(`x${token.val}`, 0, 0);
        } else {
          ctx.fillStyle = "#ef4444"; ctx.font = "13px sans-serif"; ctx.fillText("🚀", -6, 5);
        }
        ctx.restore();
      }
    });
  }

  // -------------------------------------------------------------
  // 🛫 FLIGHT ENGINE (Calls Render Backend /api/bet/play with AviaMasters)
  // -------------------------------------------------------------
  async function launchAircraft() {
    if (isFlying) return;
    if (currentBet > balance) {
      if (window.parent && window.parent !== window) window.parent.postMessage({ type: "OPEN_DEPOSIT" }, "*");
      return;
    }

    balance -= currentBet;
    updateBalanceDisplay();
    SOUNDS.launch();

    isFlying = true;
    altitude = 0.0;
    distance = 0.0;
    accumulatedMultiplier = 1.0;
    initSkyScene();

    let serverData = null;
    try {
      const res = await fetch(`${RENDER_BASE_URL}/api/bet/play`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: USER_ID,
          gameName: "AviaMasters",
          betAmount: currentBet,
          clientData: {}
        })
      });
      serverData = await res.json();
    } catch(e) {}

    const isSafeLanding = serverData?.visualOutcome?.safeLanding ?? (serverData?.isWin ?? true);
    const targetMult = serverData?.visualOutcome?.targetMultiplier || serverData?.multiplier || 1.80;

    let progress = 0;
    const flightInterval = setInterval(() => {
      progress += (0.015 * gameSpeed);
      distance += (1.4 * gameSpeed);

      // Collect tokens
      skyTokens.forEach(t => {
        if (!t.collected && Math.abs((progress * canvas.width * 0.8) - t.x) < 22) {
          t.collected = true;
          if (t.type === "MULT") {
            accumulatedMultiplier = Number((accumulatedMultiplier * t.val).toFixed(2));
            altitude += 12.0;
            SOUNDS.pickup();
          } else {
            accumulatedMultiplier = Math.max(1.0, Number((accumulatedMultiplier * 0.6).toFixed(2)));
            altitude = Math.max(5.0, altitude - 15.0);
          }
        }
      });

      document.getElementById("statAltitude").innerText = altitude.toFixed(1) + "m";
      document.getElementById("statDistance").innerText = distance.toFixed(1) + "m";
      document.getElementById("statMultiplier").innerText = "×" + accumulatedMultiplier.toFixed(1);

      const planeX = canvas.width * 0.35;
      const planeY = (canvas.height - 68) - (Math.sin(progress * Math.PI) * 115);

      drawAviaScene(planeX, planeY, progress, isSafeLanding && progress > 0.55);

      if (progress >= 1.0) {
        clearInterval(flightInterval);
        isFlying = false;

        if (isSafeLanding && serverData?.isWin) {
          accumulatedMultiplier = targetMult;
          const payout = serverData.payout || Number((currentBet * targetMult).toFixed(2));
          if (serverData.newBalance !== undefined) balance = serverData.newBalance;
          else balance += payout;
          updateBalanceDisplay();
          SOUNDS.landWin();
          triggerCleanWin(`🎉 +${payout.toFixed(2)} ETB Won (Safe Landing)!`);
        } else {
          SOUNDS.splash();
          triggerCleanWin("🌊 Ocean Splashdown! Flight ended.");
        }

        setTimeout(() => {
          altitude = 0.0; distance = 0.0; accumulatedMultiplier = 1.0;
          document.getElementById("statAltitude").innerText = "0.0m";
          document.getElementById("statDistance").innerText = "0.0m";
          document.getElementById("statMultiplier").innerText = "×1.0";
          drawAviaScene(canvas.width * 0.25, canvas.height - 68, 0, false);
          if (autoFlight) launchAircraft();
        }, 1500);
      }
    }, 50);
  }

  function setFlightSpeed(spd, btnId) {
    gameSpeed = spd;
    document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(btnId).classList.add("active");
  }

  function stepBetAmount(val) {
    if (isFlying) return;
    currentBet = Math.max(5, Math.min(balance > 0 ? balance : 1000, currentBet + val));
    document.getElementById("betDisplayVal").innerText = currentBet.toFixed(2);
  }

  function toggleAutoFlight() {
    autoFlight = !autoFlight;
    document.getElementById("autoBadge").classList.toggle("active", autoFlight);
    if (autoFlight && !isFlying) launchAircraft();
  }

  // Initial Draw
  drawAviaScene(canvas.width * 0.25, canvas.height - 68, 0, false);
</script>
</body>
</html>
